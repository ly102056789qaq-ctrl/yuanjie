<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>战斗 HUD 精修稿 · 1920×1080</title>
<!-- 设计稿：布局沿用 battle.css，只精修组件本体。固定 1920×1080 像素，切图给 Cocos 用。 -->
<style>
@font-face{font-family:"YJ Sans";src:url(../../fonts/yj-sans.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"YJ Title";src:url(../../fonts/yj-title.woff2) format("woff2")}
@font-face{font-family:"YJ Wide";src:url(../../fonts/yj-wide.woff2) format("woff2");font-weight:100 900;font-stretch:50% 150%}
@font-face{font-family:"YJ Mono";src:url(../../fonts/yj-mono.woff2) format("woff2")}

:root{
  --ink:#1A2430;--ink-deep:#0E1520;
  --accent:#3DB7D6;--accent-hi:#8FE6F7;--accent-lo:#2A8AA8;
  --ally:#3EEA96;--enemy:#F25555;--tough:#9CC0F0;
  --metal:linear-gradient(225deg,#FBFDFF 0%,#DDE6F0 42%,#AFBFD1 100%);
  --metal-dark:linear-gradient(225deg,#3A4A60 0%,#1E2A3A 55%,#121B27 100%);
  --stroke:-1px 0 0 #1A2430,1px 0 0 #1A2430,0 -1px 0 #1A2430,0 1px 0 #1A2430,-1px -1px 0 #1A2430,1px 1px 0 #1A2430,-1px 1px 0 #1A2430,1px -1px 0 #1A2430,0 2px 4px rgba(10,16,28,.5);
  --lift:drop-shadow(2px 3px 4px rgba(12,22,40,.5));
  --sans:"YJ Sans","Microsoft YaHei",sans-serif;
  --num:"YJ Wide",var(--sans);
  --title:"YJ Title",var(--sans);
  --mono:"YJ Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0E1624}
body{width:1920px;height:1080px;overflow:hidden;position:relative;font-family:var(--sans);color:#fff;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:url(plate.webp) center/cover}
.t{text-shadow:var(--stroke)}
.n{font-family:var(--num);font-stretch:85%;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0}
.abs{position:absolute}
.groove{position:relative;background:#16222A;
  box-shadow:0 0 0 1px #08101A,0 0 0 2px rgba(255,255,255,.18),inset 0 1px 2px rgba(0,0,0,.55)}
.groove>i{position:absolute;left:0;top:0;bottom:0;display:block}

/* ── 左上：回合 ── */
#wave{left:30px;top:22px;display:flex;align-items:stretch;gap:12px}
#wave .cell{display:flex;flex-direction:column;gap:2px}
#wave .k{font-size:13px;letter-spacing:.14em;opacity:.95}
#wave .v{font-size:30px;line-height:1}
#wave .v small{font-size:14px;font-weight:400;opacity:.85;margin-left:3px}
#wave .sep{width:1px;margin:4px 2px;background:linear-gradient(transparent,rgba(255,255,255,.8),transparent);box-shadow:1px 0 0 rgba(16,28,44,.5)}

/* ── 顶部：首领 ── */
#boss{left:500px;top:30px;width:920px;height:64px}
#boss .face{position:absolute;left:0;top:0;width:60px;height:60px;filter:var(--lift)}
#boss .face .clip{position:absolute;inset:4px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#1A2430;overflow:hidden}
#boss .face img{position:absolute;width:150%;left:-25%;top:-6%}
#boss .face svg{position:absolute;inset:0}
#boss .name{position:absolute;left:74px;top:2px;font-size:20px;font-weight:600;letter-spacing:.06em}
#boss .name em{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.3em;opacity:.8;margin-left:10px;vertical-align:3px}
#boss .hp{position:absolute;left:74px;right:150px;top:33px;height:12px;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
#boss .hp .lag{width:86%;background:#F7D0C8}
#boss .hp .fill{width:78%;background:linear-gradient(180deg,#FFB3A8 0%,#F25555 46%,#B82828 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
#boss .hp .seg{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(10,18,26,.55) calc(10% - 1px) 10%)}
#boss .tg{position:absolute;left:82px;right:158px;top:49px;height:4px;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
#boss .tg i{width:64%;background:linear-gradient(180deg,#E6F0FF,#8EB4EC)}
#boss .num{position:absolute;right:0;top:26px;font-size:22px}
#boss .num small{font-size:13px;opacity:.85}
#boss .weak{position:absolute;right:0;top:0;display:flex;gap:4px;align-items:center;font-size:11px;letter-spacing:.12em}
#boss .weak img{width:20px;height:20px;filter:drop-shadow(0 1px 2px rgba(10,16,28,.6))}

/* ── 右上：工具 ── */
#tools{right:26px;top:22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.tool{width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;filter:drop-shadow(0 2px 3px rgba(12,22,40,.6))}
.tool svg{width:30px;height:30px;fill:#fff}
.tool span{font-size:10px;letter-spacing:.12em}
.tool.locked{opacity:.72}

/* ── 左侧：行动条 ── */
#order{left:34px;top:172px;width:150px}
#order .rail{position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(transparent,rgba(255,255,255,.75) 6%,rgba(255,255,255,.75) 94%,transparent);box-shadow:1px 0 0 rgba(16,28,44,.4)}
.od{position:relative;margin:0 0 12px 14px;width:104px;height:74px;filter:var(--lift)}
.od .pic{position:absolute;inset:0;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);background:#1A2430;overflow:hidden}
.od .pic img{position:absolute;width:140%;left:-20%;top:-10%}
.od .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,16,28,.65))}
.od svg.fr{position:absolute;inset:0;overflow:visible}
.od .av{position:absolute;right:6px;bottom:3px;font-size:17px}
.od .side{position:absolute;left:0;top:0;bottom:0;width:4px}
.od.ally .side{background:linear-gradient(180deg,#9DF3C6,#2FCB7A)}
.od.enemy .side{background:linear-gradient(180deg,#FF9A90,#D63B3B)}
.od.now{width:128px;height:90px;margin-left:22px}
.od.now .tag{position:absolute;left:-1px;top:-19px;font-size:11px;letter-spacing:.18em;padding:2px 8px 2px 6px;background:linear-gradient(90deg,#3DB7D6,#2A8AA8);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%);text-shadow:0 1px 1px rgba(10,30,40,.6)}
.od.now::before{content:"";position:absolute;left:-18px;top:50%;width:10px;height:10px;margin-top:-5px;transform:rotate(45deg);background:#fff;box-shadow:0 0 0 1px #1A2430,0 0 8px rgba(61,183,214,.9)}
.od .tick{position:absolute;left:-16px;top:50%;width:6px;height:1px;background:#fff}

/* ── 左下：队伍 ── */
#party{left:86px;bottom:30px;display:flex;gap:22px;align-items:flex-end}
.pc{position:relative;width:250px}
.pc .bust{position:relative;height:236px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,#000 82%,transparent 100%)}
.pc .bust img{position:absolute;left:50%;transform:translateX(-50%);filter:drop-shadow(2px 4px 6px rgba(12,22,40,.55))}
.pc .plate{position:relative;height:66px;margin-top:-10px;filter:var(--lift)}
.pc .plate .bodyp{position:absolute;inset:0;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));background:var(--metal-dark)}
.pc .plate .bodyp::before{content:"";position:absolute;inset:0;background:url(../../assets/battle/ui-noise.png);opacity:.18;mix-blend-mode:overlay}
.pc .plate svg.fr{position:absolute;inset:0;overflow:visible}
.pc .row1{position:absolute;left:12px;right:12px;top:8px;display:flex;align-items:center;gap:6px}
.pc .row1 img{width:20px;height:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.pc .nm{font-size:16px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.pc .hpn{margin-left:auto;font-size:18px}
.pc .hpn small{font-size:11px;opacity:.7;font-weight:400}
.pc .hp{position:absolute;left:12px;right:12px;top:36px;height:8px}
.pc .hp i{background:linear-gradient(180deg,#D8FFE9 0%,#3EEA96 40%,#17A862 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.pc .hp.low i{background:linear-gradient(180deg,#FFE0A0,#F2A23A 45%,#C97314)}
.pc .en{position:absolute;left:12px;right:12px;top:50px;height:3px;background:rgba(255,255,255,.12)}
.pc .en i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#5FE0FF,#BDF3FF)}
.pc .ult{position:absolute;right:-6px;top:108px;width:62px;height:62px;filter:drop-shadow(1px 2px 3px rgba(12,22,40,.55))}
.pc .ult svg{position:absolute;inset:0}
.pc .ult img{position:absolute;inset:13px;width:36px;height:36px}
.pc .ult b{position:absolute;left:50%;top:100%;transform:translate(-50%,-4px);font-size:12px;white-space:nowrap}
.pc.active .plate .bodyp{background:linear-gradient(225deg,#4A6684 0%,#24384E 55%,#14202E 100%)}
.pc.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-12px;height:3px;background:linear-gradient(90deg,transparent,#3DB7D6 20%,#8FE6F7 50%,#3DB7D6 80%,transparent);box-shadow:0 0 8px rgba(61,183,214,.8)}
.pc:not(.active) .bust{opacity:.92}
.pc .buffs{position:absolute;left:10px;top:200px;display:flex;gap:4px}
.pc .buffs img{width:26px;height:26px;border-radius:3px;box-shadow:0 0 0 1px #1A2430,0 0 0 2px rgba(255,255,255,.6);filter:var(--lift)}

/* ── 右下：技能 ── */
#dock{right:46px;bottom:30px;width:470px;display:flex;flex-direction:column;align-items:flex-end}
#banner{text-align:right;margin-bottom:12px}
#banner .k{font-size:13px;letter-spacing:.2em;opacity:.95}
#banner .k em{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.3em;margin-left:8px;opacity:.75}
#banner .nm{font-size:26px;font-weight:600;letter-spacing:.06em;line-height:1.2}
#banner .rule{height:2px;margin-top:6px;margin-left:auto;width:220px;background:linear-gradient(90deg,transparent,#fff 40%,#fff);box-shadow:0 1px 0 rgba(16,28,44,.6)}
#skills{display:flex;gap:16px;align-items:flex-end}
.sk{display:flex;flex-direction:column;align-items:center;gap:8px}
.tile{position:relative;width:136px;height:136px;filter:drop-shadow(2px 4px 5px rgba(12,22,40,.55))}
.tile .outer{position:absolute;inset:0;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);background:var(--metal)}
.tile .outer::before{content:"";position:absolute;inset:0;background:url(../../assets/battle/ui-noise.png);opacity:.25;mix-blend-mode:multiply}
.tile .inner{position:absolute;inset:5px;clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,0 100%);background:#1A2430;overflow:hidden}
.tile .inner img{width:100%;height:100%;object-fit:cover;display:block}
.tile svg.fr{position:absolute;inset:0;overflow:visible}
.tile .key{position:absolute;left:-1px;top:-1px;width:24px;height:22px;background:#1A2430;clip-path:polygon(0 0,100% 0,100% 60%,60% 100%,0 100%);font-family:var(--mono);font-size:12px;line-height:20px;padding-left:6px;color:#DDE6F0}
.tile .glint{position:absolute;top:5px;right:20px;width:8px;height:2px;background:#fff;box-shadow:0 0 4px #fff}
.sk.sel .tile{transform:translateY(-6px)}
.sk.sel .tile .outer{background:linear-gradient(225deg,#E9FBFF 0%,#8FE6F7 40%,#2A8AA8 100%)}
.sk.ult .tile{filter:drop-shadow(0 0 10px rgba(61,183,214,.55)) drop-shadow(2px 4px 5px rgba(12,22,40,.55))}
.cost{display:flex;gap:5px;align-items:center;height:16px}
.cost i{width:10px;height:10px;transform:rotate(45deg);background:linear-gradient(135deg,#fff,#9BD9ED);box-shadow:0 0 0 1px #1A2430}
.cost i.off{background:rgba(255,255,255,.15)}
.cost.label{font-size:13px}
#sp{display:flex;align-items:center;gap:10px;margin-top:14px}
#sp .k{font-size:12px;letter-spacing:.14em}
#sp .pips{display:flex;gap:6px}
#sp .pips i{width:14px;height:14px;transform:rotate(45deg);background:rgba(255,255,255,.18);box-shadow:0 0 0 1px #1A2430,inset 0 0 0 1px rgba(255,255,255,.55)}
#sp .lock{font-size:11px;letter-spacing:.1em;opacity:.8}

/* ── 敌人头顶 ── */
.ub{width:190px}
.ub .nm{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;letter-spacing:.05em;margin-bottom:5px}
.ub .nm .aim{width:8px;height:8px;transform:rotate(45deg);background:#fff;box-shadow:0 0 0 1px #1A2430}
.ub .nm .lv{font-family:var(--num);font-stretch:85%;font-size:12px;opacity:.85;font-weight:600}
.ub .nm .wk{margin-left:auto;display:flex;gap:2px}
.ub .nm .wk img{width:18px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.ub .hp{height:8px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.ub .hp i{background:linear-gradient(180deg,#FFB3A8 0%,#F25555 46%,#B82828 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.ub .tg{height:4px;margin:3px 4px 0}
.ub .tg i{background:linear-gradient(180deg,#F0F6FF,#8EB4EC)}
.ub .marks{display:flex;gap:4px;margin-top:5px}
.ub .marks img{width:22px;height:22px;border-radius:3px;box-shadow:0 0 0 1px #1A2430,0 0 0 2px rgba(255,255,255,.55)}

/* 支援 / 调度 */
.side-btn{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.85}
.side-btn .dia{width:44px;height:44px;position:relative;filter:var(--lift)}
.side-btn svg{width:44px;height:44px}
.side-btn span{font-size:11px;letter-spacing:.14em}

#cue{left:50%;top:118px;transform:translateX(-50%);font-size:15px;letter-spacing:.24em}
#cue::before,#cue::after{content:"";display:inline-block;width:40px;height:1px;background:#fff;vertical-align:middle;margin:0 14px;box-shadow:0 1px 0 rgba(16,28,44,.6)}
</style>
</head>
<body>
<div id="bg"></div>

<!-- 回合 -->
<div id="wave" class="abs">
  <div class="cell"><span class="k t">回合</span><span class="v n t">01<small>/ 锁定</small></span></div>
  <div class="sep"></div>

</div>

    <svg viewBox="0 0 60 60"><polygon points="30,1.5 58.5,30 30,58.5 1.5,30" fill="none" stroke="#F4F7FB" stroke-width="2"/><polygon points="30,6 54,30 30,54 6,30" fill="none" stroke="#1A2430" stroke-width="1"/></svg>
  </div>

  <div class="tool"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="2"/><rect x="4" y="11" width="16" height="2"/><rect x="4" y="16" width="16" height="2"/></svg><span class="t">菜单</span></div>

<!-- 行动条 -->
<div id="order" class="abs">

  <div class="od ally now">
    <span class="tag">行动中</span>
    <div class="pic"><img src="../../assets/battle/siwei-face.webp" alt="" style="width:120%;left:-10%;top:-4%"></div>

    <svg class="fr" viewBox="0 0 128 90" preserveAspectRatio="none"><path d="M.75 .75H117L127.25 11V89.25H.75Z" fill="none" stroke="#3DB7D6" stroke-width="2"/></svg>

    <svg class="fr" viewBox="0 0 104 74" preserveAspectRatio="none"><path d="M.75 .75H93.5L103.25 10.5V73.25H.75Z" fill="none" stroke="#F4F7FB" stroke-width="1.5"/></svg>
    <span class="av n t">13</span>
  </div>
  <div class="od ally">
    <span class="tick"></span>
    <div class="pic"><img src="../../assets/art/rin-open.png" alt="" style="width:240%;left:-72%;top:-62%"></div>
    <i class="side"></i>
    <svg class="fr" viewBox="0 0 104 74" preserveAspectRatio="none"><path d="M.75 .75H93.5L103.25 10.5V73.25H.75Z" fill="none" stroke="#F4F7FB" stroke-width="1.5"/></svg>
    <span class="av n t">21</span>
  </div>
  <div class="od enemy">
    <span class="tick"></span>
    <div class="pic"><img src="../../assets/battle/enemy-a-face.webp" alt="" style="width:200%;left:-50%;top:-4%"></div>
    <i class="side"></i>
    <svg class="fr" viewBox="0 0 104 74" preserveAspectRatio="none"><path d="M.75 .75H93.5L103.25 10.5V73.25H.75Z" fill="none" stroke="#F4F7FB" stroke-width="1.5"/></svg>

  </div>

    <span class="av n t">38</span>
  </div>
</div>

<!-- 敌人头顶 -->
<div class="ub abs" style="left:530px;top:180px">
  <div class="nm t"><i class="aim"></i>测试敌人<span class="lv">LV.—</span><span class="wk"><img src="../../assets/icons/el-fuxiang.webp" alt=""></span></div>
  <div class="hp groove"><i style="width:78%"></i></div>
  <div class="tg groove"><i style="width:64%"></i></div>
  <div class="marks"><img src="../../assets/battle/icons/buff-dream.webp" alt=""></div>
</div>
<div class="ub abs" style="left:345px;top:270px">
  <div class="nm t"><i class="aim"></i>测试敌人<span class="lv">LV.—</span><span class="wk"><img src="../../assets/icons/el-fuxiang.webp" alt=""></span></div>
  <div class="hp groove"><i style="width:100%"></i></div>
  <div class="tg groove"><i style="width:100%"></i></div>
</div>

<!-- 支援 / 调度 -->
<div class="side-btn abs" style="left:38px;top:790px">
  <div class="dia"><svg viewBox="0 0 44 44"><polygon points="22,2 42,22 22,42 2,22" fill="rgba(26,36,48,.55)" stroke="#F4F7FB" stroke-width="1.5"/><g fill="none" stroke="#fff" stroke-width="1.8"><path d="M19 25a3.5 3.5 0 0 0 5 0l2.2-2.2a3.5 3.5 0 0 0-5-5L20 19"/><path d="M25 19a3.5 3.5 0 0 0-5 0l-2.2 2.2a3.5 3.5 0 0 0 5 5L24 25"/></g></svg></div>
  <span class="t">支援</span>
</div>
<div class="side-btn abs" style="right:34px;top:390px">
  <div class="dia"><svg viewBox="0 0 44 44"><polygon points="22,2 42,22 22,42 2,22" fill="rgba(26,36,48,.55)" stroke="#F4F7FB" stroke-width="1.5"/><g fill="none" stroke="#fff" stroke-width="1.8"><circle cx="22" cy="22" r="7"/><path d="M22 18.5V22l2.6 1.6"/></g></svg></div>
  <span class="t">瞬时调度</span>
</div>

<!-- 队伍 -->
<div id="party" class="abs">
  <div class="pc active">
    <div class="bust"><img src="../../assets/battle/siwei-bust.webp" alt="" style="height:300px;top:0"></div>
