<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf3ff"><title>源界 ASTERIAL · 主页</title>
<link rel="preload" href="assets/art/siwei-stand.webp" as="image"><link rel="stylesheet" href="lobby/lobby.css?v=wallet-glow">
<link rel="stylesheet" href="charui/rarity.css">
<link rel="stylesheet" href="lobby/attendance.css?v=receipt">
<link rel="stylesheet" href="lobby/reward-success.css">
<script type="module" src="lobby/lobby.js?v=debut-search"></script>
</head>
<body>
<main class="hall">
  <div class="sky" aria-hidden="true"></div><div class="orbit" aria-hidden="true"></div>
  <header class="top">
    <button class="profile" data-open="profile"><img id="avatar" src="assets/battle/siwei-face.webp" alt=""><span><b id="nickname">旅人</b><small id="uid">本地档案</small></span><span class="level">Lv.<strong id="level">1</strong><i id="expbar"></i></span></button>
    <div class="resources" aria-label="货币与检索凭证"></div>
    <nav class="utility" aria-label="邮件与设置"><button data-open="mail" aria-label="邮件"><i data-icon="mail"></i></button><button data-open="settings" aria-label="设置"><i data-icon="settings"></i></button></nav>
  </header>
  <div class="left-tools">
    <aside class="promo"><button class="promolink" id="promo-open"><small class="promo-kind"><svg class="tide-mark" aria-hidden="true"><use href="assets/lobby/field-marks.svg?v=insignias#tide"></use></svg><span id="promo-kind">试用行动</span></small><strong id="promo-name">冰火同行</strong></button><div class="slides"><button aria-label="上一张推荐" id="previous">‹</button><span id="slide-number">01/03</span><button aria-label="下一张推荐" id="next">›</button></div></aside>
    <aside class="logbook" aria-label="行动日志">
    <button class="log-head" data-open="plan"><span>行动日志</span><small>QUEST LOG</small><i data-icon="plan"></i></button>
    <button class="log-item" data-open="sign"><span>今日签到</span><b id="check-state">待记录</b></button>
    <button class="log-item" data-open="story-list"><span>故事阅览</span><b id="log-reads">0 / 10</b></button>
  </aside>
    <svg class="mark-material" aria-hidden="true" width="0" height="0">
      <defs>
        <linearGradient id="jade-face" x1="18%" y1="0%" x2="72%" y2="100%">
          <stop stop-color="white" stop-opacity=".98"/>
          <stop offset=".27" stop-color="white" stop-opacity=".94"/>
          <stop offset=".50" stop-color="white" stop-opacity=".64"/>
          <stop offset=".75" stop-color="#f7f7f7" stop-opacity=".74"/>
          <stop offset="1" stop-color="white" stop-opacity=".96"/>
        </linearGradient>
        <linearGradient id="dock-enamel" x2=".22" y2="1">
          <stop stop-color="white"/><stop offset=".48" stop-color="white" stop-opacity=".96"/>
          <stop offset=".77" stop-color="#f8faff" stop-opacity=".84"/><stop offset="1" stop-color="white"/>
        </linearGradient>
        <filter id="jade-relief" filterUnits="userSpaceOnUse" x="-10" y="-10" width="84" height="86" color-interpolation-filters="sRGB">
          <feComponentTransfer in="SourceAlpha" result="silhouette"><feFuncA type="linear" slope="1.58"/></feComponentTransfer>
          <feGaussianBlur in="silhouette" stdDeviation="1.55" result="polishedEdge"/>
          <feSpecularLighting in="polishedEdge" surfaceScale="4" specularConstant=".95" specularExponent="18" lighting-color="white" result="reflection">
            <feDistantLight azimuth="222" elevation="50"/>
          </feSpecularLighting>
          <feMorphology in="silhouette" operator="erode" radius="1.6" result="interior"/>
          <feComposite in="silhouette" in2="interior" operator="out" result="bevel"/>
          <feComposite in="reflection" in2="bevel" operator="in" result="glint"/>
          <feMorphology in="silhouette" operator="dilate" radius=".7" result="rim"/>
          <feOffset in="rim" dx=".35" dy="2.5" result="extrusion"/>
          <feDropShadow in="extrusion" dx=".3" dy="1.2" stdDeviation="1.1" flood-color="#242424" flood-opacity=".65" result="cast"/>
          <feComposite in="cast" in2="silhouette" operator="out" result="outerShadow"/>
          <feFlood flood-color="#a5a5a5"/><feComposite in2="extrusion" operator="in" result="silverEdge"/>
          <feComposite in="silverEdge" in2="silhouette" operator="out" result="side"/>
          <feMerge><feMergeNode in="outerShadow"/><feMergeNode in="side"/><feMergeNode in="SourceGraphic"/><feMergeNode in="glint"/></feMerge>
        </filter>
        <symbol id="quick-news" viewBox="0 0 256 256"><path d="M228.54,86.66l-176.06-54A16,16,0,0,0,32,48V192a16,16,0,0,0,16,16,16,16,0,0,0,4.52-.65L136,181.73V192a16,16,0,0,0,16,16h32a16,16,0,0,0,16-16v-29.9l28.54-8.75A16.09,16.09,0,0,0,240,138V102A16.09,16.09,0,0,0,228.54,86.66ZM184,192H152V176.82L184,167Zm40-54-.11,0L152,160.08V79.91L223.89,102l.11,0v36Z"/></symbol>
        <symbol id="quick-friends" viewBox="0 0 256 256"><path d="M164.47,195.63a8,8,0,0,1-6.7,12.37H10.23a8,8,0,0,1-6.7-12.37,95.83,95.83,0,0,1,47.22-37.71,60,60,0,1,1,66.5,0A95.83,95.83,0,0,1,164.47,195.63Zm87.91-.15a95.87,95.87,0,0,0-47.13-37.56A60,60,0,0,0,144.7,54.59a4,4,0,0,0-1.33,6A75.83,75.83,0,0,1,147,150.53a4,4,0,0,0,1.07,5.53,112.32,112.32,0,0,1,29.85,30.83,23.92,23.92,0,0,1,3.65,16.47,4,4,0,0,0,3.95,4.64h60.3a8,8,0,0,0,7.73-5.93A8.22,8.22,0,0,0,252.38,195.48Z"/></symbol>
        <mask id="cut-news" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><use href="#quick-news" width="64" height="64" fill="white" color="white"/></mask>
        <mask id="cut-friends" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><use href="#quick-friends" width="64" height="64" fill="white" color="white"/></mask>
        <mask id="cut-plan" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><use href="assets/lobby/field-marks.svg?v=insignias#plan" width="64" height="64" fill="white" color="white"/></mask>
        <mask id="cut-events" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><use href="assets/lobby/field-marks.svg?v=insignias#events" width="64" height="64" fill="white" color="white"/></mask>
        <mask id="cut-supplies" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><use href="assets/lobby/field-marks.svg?v=insignias#supplies" width="64" height="64" fill="white" color="white"/></mask>
      </defs>
    </svg>
    <nav class="quick-actions" aria-label="快捷导航">
      <button data-open="news"><svg viewBox="0 0 64 64" aria-hidden="true"><g filter="url(#jade-relief)"><rect width="64" height="64" fill="url(#jade-face)" mask="url(#cut-news)"/></g></svg><b>公告</b></button>
      <button data-open="friends"><svg viewBox="0 0 64 64" aria-hidden="true"><g filter="url(#jade-relief)"><rect width="64" height="64" fill="url(#jade-face)" mask="url(#cut-friends)"/></g></svg><b>好友</b></button>
      <button data-open="plan"><svg viewBox="0 0 64 64" aria-hidden="true"><g filter="url(#jade-relief)"><rect width="64" height="64" fill="url(#jade-face)" mask="url(#cut-plan)"/></g></svg><b>计划</b></button>
      <button data-open="events"><svg viewBox="0 0 64 64" aria-hidden="true"><g filter="url(#jade-relief)"><rect width="64" height="64" fill="url(#jade-face)" mask="url(#cut-events)"/></g></svg><b>活动</b></button>
      <button data-open="supplies"><svg viewBox="0 0 64 64" aria-hidden="true"><g filter="url(#jade-relief)"><rect width="64" height="64" fill="url(#jade-face)" mask="url(#cut-supplies)"/></g></svg><b>补给</b></button>
    </nav>
  </div>
  <div class="hero"><div class="figure"><img id="standing" src="assets/art/siwei-stand.webp" alt="思惟诺姆"><img id="eyes" src="assets/art/siwei-stand-blink.webp" alt=""><img class="orb" src="assets/art/siwei-orb.webp" alt=""></div></div>
  <section class="commands" aria-label="主要玩法">
    <button class="key expedition" data-open="expedition">
      <span class="faceplate">
        <span class="chapter-art" aria-hidden="true"></span>
        <span class="type"><strong>探索行动</strong><small>EXPEDITION</small><span class="mission" id="mission">故事线 · 循环与终结</span></span>
        <span class="reading"><b id="read-count">00</b><small>/ <span id="story-count">10</span></small><span>已阅故事</span></span>
        <span class="launch-arrow" aria-hidden="true"><i data-icon="arrow"></i></span>
      </span>
    </button>
    <div class="pair first">
      <button class="key companions" data-open="companions"><span class="faceplate"><img class="seal" src="assets/lobby/survey-marks/companions.png?v=ice-print" alt=""><span class="type"><strong>同行者</strong><small>COMPANIONS</small><span class="detail">角色养成</span></span></span></button>
      <button class="key formation" data-open="formation"><span class="faceplate"><img class="seal" src="assets/lobby/survey-marks/formation.png?v=ice-print" alt=""><span class="type"><strong>编队</strong><small>FORMATION</small><span class="detail" id="team-count">出战成员　4 / 4</span></span></span></button>
    </div>
    <div class="pair second">
      <button class="key search" data-open="search"><span class="faceplate"><svg class="seal receiver" viewBox="0 0 512 512" aria-hidden="true">
          <defs><clipPath id="dish-frame"><path d="M0 0H352V128H512V512H0Z"/></clipPath></defs>
          <image href="assets/lobby/survey-marks/global-search.png?v=ice-print" width="512" height="512" clip-path="url(#dish-frame)"/>
          <path class="signal-mark" d="M500 28 494 35 491 35 484 27 472 27 414 111 444 111Z"/>
          <path class="signal-mark signal-near" d="M454 27 424 27 367 111 396 111Z"/>
          <g class="receiver-lock" transform="rotate(-12 314 126)">
            <rect x="303" y="115" width="22" height="22" fill="#ffbf81"/>
            <rect x="272" y="84" width="84" height="84" rx="5" fill="none" stroke="#ffcd95" stroke-width="6" stroke-dasharray="21 63" pathLength="336"/>
          </g>
        </svg><span class="type"><strong>全域检索</strong><small>GLOBAL SEARCH</small></span></span></button>
      <button class="key anomaly" data-open="special">
        <span class="faceplate">
          <span class="type"><strong>特殊行动</strong><small>SPECIAL OPERATION</small><span class="anomaly-caption">红潮干涉</span></span>
        </span>
        <svg class="tide-art" viewBox="0 0 210 112" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="surge-ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="20" y2="116">
              <stop stop-color="#ff6655"/><stop offset=".32" stop-color="#e63942"/><stop offset=".73" stop-color="#b82b4a"/><stop offset="1" stop-color="#661f43"/>
            </linearGradient>
            <linearGradient id="surge-left"><stop stop-color="white" stop-opacity="0"/><stop offset=".24" stop-color="white" stop-opacity=".76"/><stop offset=".47" stop-color="white"/></linearGradient>
            <mask id="surge-blend" maskUnits="userSpaceOnUse" x="-9" y="-13" width="222" height="125">
              <rect x="-9" y="-13" width="222" height="125" fill="url(#surge-left)"/>
            </mask>
            <clipPath id="surge-water">
              <path id="surge-profile" d="M-8 102 C18 94 45 102 69 88 C91 76 99 60 112 44 C130 24 151 16 170 23 C185 28 192 40 191 49 C182 38 173 37 165 45 C151 58 158 76 174 81 C187 85 200 80 210 74 L210 116 L-8 116 Z"/>
            </clipPath>
            <clipPath id="surge-window"><rect x="-8" y="-9" width="218" height="121"/></clipPath>
          </defs>
          <g clip-path="url(#surge-window)" mask="url(#surge-blend)">
            <path class="swell" d="M-12 107 Q38 104 65 86 T104 71 Q116 72 124 85 Q142 104 169 86 Q197 66 217 73 V117 H-12Z" fill="#b34a63" opacity=".48"/>
            <image class="buoy-roll" href="assets/lobby/tide-buoy.webp" x="66" y="18" width="56" height="83"/>
            <g clip-path="url(#surge-water)">
              <rect x="-8" y="-9" width="218" height="126" fill="url(#surge-ink)"/>
              <path class="crest-light" fill="#ffaba1" d="M79 88 C103 73 107 47 135 32 C154 22 173 22 184 34 C173 26 155 27 139 37 C110 53 102 78 79 88Z"/>
              <g class="breaking-foam" fill="#fff0e0">
                <path d="M-26 4 Q-13-5 -1-4 Q8-4 16 3 Q10 0 6 1 L9 4 Q2 0 -3 0 L0 2 Q-9 0 -15 3 L-13 1Z"/>
                <path d="M-29 5 Q-33 6 -37 10 Q-32 8 -29 7Z M13 7 Q17 8 18 12 Q16 10 14 10Z"/>
              </g>
              <g class="undertow">
                <path d="M-8 102 C60 101 91 77 111 62 C91 99 51 102 15 106Z M78 115 C119 104 125 78 131 47 C131 83 127 104 109 115Z M139 115 C156 94 165 91 202 85 C178 96 163 103 157 115Z" fill="#772441" opacity=".78"/>
                <path d="M-6 104 Q66 103 99 79 Q64 109 -6 108Z M109 116 Q145 91 145 60 Q150 93 121 116Z M156 109 Q179 94 205 91 Q175 100 165 111Z" fill="#ff8576" opacity=".8"/>
              </g>
              <g fill="none" class="current-lines" stroke="#fff0dd" stroke-linecap="round">
                <path stroke-width="1.75" stroke-dasharray="20 9 5 120" d="M13 101 Q89 99 123 44 T174 11"/>
                <path stroke-width="1.15" stroke-dasharray="13 10 3 90" d="M83 114 Q124 96 134 55"/>
              </g>
            </g>
          </g>
          <g class="foam-fragments" fill="#e54848">
            <path class="spindrift drop-long" d="M-5 1Q-1-3 5-2Q3 1-5 1Z"/>
            <path class="spindrift drop-high" d="M-2 2Q-2-1 2-3Q3 0-2 2Z"/>
            <path class="spindrift drop-low" d="M-3 1Q-1-2 3-1Q2 1-3 1Z"/>
          </g>
          <path class="return-ripple" d="M8 102 Q34 97 51 99 T83 96 M35 106 Q55 103 65 104" fill="none" stroke="#b23c55" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <nav class="dock" aria-label="档案与物品">
      <button class="dock-archives" data-open="archives">
        <span class="dock-art" aria-hidden="true"><svg viewBox="0 0 64 64">
          <mask id="dock-cut-archives"><use href="assets/lobby/field-marks.svg?v=tide-edition#archives" width="64" height="64" fill="white" color="white"/></mask>
          <rect width="64" height="64" fill="url(#dock-enamel)" mask="url(#dock-cut-archives)"/>
        </svg></span>
        <span class="dock-label"><b>档案</b><small lang="en">ARCHIVES</small></span>
      </button>
      <button class="dock-depot" data-open="depot">
        <span class="dock-art" aria-hidden="true"><svg viewBox="0 0 64 64">
          <mask id="dock-cut-depot"><use href="assets/lobby/field-marks.svg?v=tide-edition#depot" width="64" height="64" fill="white" color="white"/></mask>
          <rect width="64" height="64" fill="url(#dock-enamel)" mask="url(#dock-cut-depot)"/>
        </svg></span>
        <span class="dock-label"><b>仓库</b><small lang="en">DEPOT</small></span>
      </button>
    </nav>
  </section>
  <footer class="foot"><button data-open="credits-art">美术署名</button></footer>
</main>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><div><small id="panel-en"></small><h1 id="panel-title"></h1></div><button id="close" aria-label="关闭">×</button></div><div id="panel-body"></div></dialog>
<noscript>请启用 JavaScript 进入大厅。<a href="atlas.html">阅读世界档案</a></noscript>
</body></html>
